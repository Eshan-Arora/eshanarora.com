      .panel{fill:none;stroke:#98a2b3;stroke-width:2}
      .header{fill:#f2f4f7}
      .stripe{fill:#f8fafc}
      .rule{stroke:#d0d5dd;stroke-width:1}
      .column{font:700 12px system-ui,-apple-system,sans-serif;letter-spacing:.7px;fill:#475467}
      .cell{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#101828}
      .link{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#3976d3;text-decoration:underline}
    </style>
  </defs>

  <rect x="40" y="40" width="1320" height="540" rx="18" class="panel"/>
