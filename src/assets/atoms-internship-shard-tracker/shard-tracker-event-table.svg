<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1240" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Shard tracker event table</title>
  <desc id="desc">A simplified event table listing timestamps, domains, shard ranges, grant IDs, regions, linked pod IDs, and state transitions.</desc>
  <defs>
