<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="940" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Grant movement transitions covered by structured logs</title>
  <desc id="desc">Grant activation transitions through created, allocated, allocated loaded, and active. Grant removal transitions through active, revoked, revoked unloaded, and removed. Each transition name is circled.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <style>
      .heading{font:700 27px system-ui,-apple-system,sans-serif;fill:#101828;text-anchor:middle}
      .state{font:700 21px system-ui,-apple-system,sans-serif;text-anchor:middle;dominant-baseline:middle}
      .terminal{font:600 20px system-ui,-apple-system,sans-serif;fill:#101828;text-anchor:middle;dominant-baseline:middle}
      .edge{stroke:#667085;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .event{font:600 18px system-ui,-apple-system,sans-serif;fill:#475467;text-anchor:middle}
      .emphasis{fill:none;stroke:#ef4e53;stroke-width:5}
    </style>
  </defs>

  <text x="700" y="34" class="heading">Grant activation</text>

  <rect x="25" y="90" width="190" height="86" rx="16" fill="#f8fafc" stroke="#98a2b3" stroke-width="2"/>
  <text x="120" y="133" class="terminal">Grant created</text>
  <path d="M215 133 H325" class="edge"/>
  <ellipse cx="270" cy="100" rx="55" ry="25" class="emphasis"/>
  <text x="270" y="107" class="event">assign</text>

  <rect x="335" y="90" width="200" height="86" rx="16" fill="#5794f2"/>
  <text x="435" y="133" class="state" fill="#fff">ALLOCATED</text>
  <path d="M535 133 H645" class="edge"/>
  <ellipse cx="590" cy="100" rx="58" ry="25" class="emphasis"/>
  <text x="590" y="107" class="event">update</text>

  <rect x="655" y="90" width="305" height="86" rx="16" fill="#53cce6"/>
  <text x="807" y="133" class="state" fill="#101828">ALLOCATED_LOADED</text>
  <path d="M960 133 H1070" class="edge"/>
  <ellipse cx="1015" cy="100" rx="66" ry="25" class="emphasis"/>
  <text x="1015" y="107" class="event">promote</text>

  <rect x="1080" y="90" width="190" height="86" rx="16" fill="#73bf69"/>
  <text x="1175" y="133" class="state" fill="#fff">ACTIVE</text>

  <text x="700" y="260" class="heading">Grant removal</text>

  <rect x="25" y="315" width="190" height="86" rx="16" fill="#73bf69"/>
  <text x="120" y="358" class="state" fill="#fff">ACTIVE</text>
  <path d="M215 358 H325" class="edge"/>
  <ellipse cx="270" cy="325" rx="58" ry="25" class="emphasis"/>
  <text x="270" y="332" class="event">revoke</text>

  <rect x="335" y="315" width="200" height="86" rx="16" fill="#ff9830"/>
  <text x="435" y="358" class="state" fill="#fff">REVOKED</text>
  <path d="M535 358 H645" class="edge"/>
  <ellipse cx="590" cy="325" rx="58" ry="25" class="emphasis"/>
  <text x="590" y="332" class="event">update</text>

  <rect x="655" y="315" width="305" height="86" rx="16" fill="#8e8e8e"/>
  <text x="807" y="358" class="state" fill="#fff">REVOKED_UNLOADED</text>
  <path d="M960 358 H1125" class="edge"/>
  <ellipse cx="1040" cy="325" rx="88" ry="25" class="emphasis"/>
  <text x="1040" y="332" class="event">release or expire</text>

  <rect x="1135" y="315" width="230" height="86" rx="16" fill="#f8fafc" stroke="#98a2b3" stroke-width="2"/>
  <text x="1250" y="358" class="terminal">Grant removed</text>
</svg>
