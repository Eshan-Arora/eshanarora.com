    <text x="75" y="515">pod-e90a</text><text x="250" y="515">central-1</text><text x="360" y="515">3200–4000</text>
    <text x="75" y="549">pod-k15f</text><text x="250" y="549">west-1</text><text x="360" y="549">4000–4800</text>
    <text x="75" y="583">pod-m62d</text><text x="250" y="583">west-1</text><text x="360" y="583">4000–4800</text>
    <text x="75" y="617">pod-n08c</text><text x="250" y="617">west-1</text><text x="360" y="617">4800–5600</text>
    <text x="75" y="651">pod-p33b</text><text x="250" y="651">west-1</text><text x="360" y="651">4800–5600</text>
    <text x="75" y="685">pod-q74e</text><text x="250" y="685">west-2</text><text x="360" y="685">5600–6400</text>
    <text x="75" y="719">pod-r19a</text><text x="250" y="719">west-2</text><text x="360" y="719">6400–7200</text>
    <text x="75" y="753">pod-s55c</text><text x="250" y="753">west-2</text><text x="360" y="753">6400–7200</text>
  </g>

