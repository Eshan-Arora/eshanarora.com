    <line x1="60" y1="593" x2="1340" y2="593" class="row-rule" opacity=".35"/>
    <line x1="60" y1="627" x2="1340" y2="627" class="row-rule" opacity=".35"/>
    <line x1="60" y1="661" x2="1340" y2="661" class="row-rule" opacity=".35"/>
    <line x1="60" y1="695" x2="1340" y2="695" class="row-rule" opacity=".35"/>
    <line x1="60" y1="729" x2="1340" y2="729" class="row-rule" opacity=".35"/>
    <line x1="60" y1="763" x2="1340" y2="763" class="row-rule" opacity=".35"/>
