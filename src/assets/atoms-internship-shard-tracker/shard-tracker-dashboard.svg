<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1632" viewBox="0 0 1400 816" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated shard tracker dashboard</title>
  <desc id="desc">A simplified Grafana-style dashboard with filters, a one-hour time range, pod and shard metadata, and many grant handoffs across timeline rows.</desc>
  <defs>
    <style>
      .ink{fill:#101828}.muted{fill:#475467}.inverse{fill:#fff}
      .filter-label{font:600 13px system-ui,-apple-system,sans-serif;letter-spacing:.2px}
      .filter-value{font:500 16px system-ui,-apple-system,sans-serif}
      .column{font:700 12px system-ui,-apple-system,sans-serif;letter-spacing:1px}
      .meta{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace}
      .tick{font:500 13px system-ui,-apple-system,sans-serif}
      .bar-label{font:700 10px system-ui,-apple-system,sans-serif;letter-spacing:.4px;fill:#101828}
      .filter{fill:#f8fafc;stroke:#98a2b3;stroke-width:2}
      .panel{fill:none;stroke:#98a2b3;stroke-width:2}
      .metadata{fill:#f2f4f7}
      .plot{fill:#292c33}
      .row-rule{stroke:#d0d5dd;stroke-width:1}
      .grid{stroke:#667085;stroke-width:1;opacity:.45}
      .active{fill:#73bf69}
      .allocated{fill:#5794f2}
      .loaded{fill:#53cce6}
      .revoked{fill:#ff9830}
      .unloaded{fill:#8e8e8e}
    </style>
  </defs>

  <g>
    <text x="40" y="55" class="filter-label muted">Environment</text>
    <rect x="40" y="68" width="170" height="46" rx="10" class="filter"/>
    <circle cx="60" cy="91" r="5" fill="#73bf69"/>
    <text x="74" y="97" class="filter-value ink">staging</text>
    <text x="191" y="97" text-anchor="end" class="filter-value muted">⌄</text>

    <text x="225" y="55" class="filter-label muted">Tenant</text>
    <rect x="225" y="68" width="135" height="46" rx="10" class="filter"/>
    <text x="243" y="97" class="filter-value ink">test</text>
    <text x="341" y="97" text-anchor="end" class="filter-value muted">⌄</text>

    <text x="375" y="55" class="filter-label muted">Service</text>
    <rect x="375" y="68" width="220" height="46" rx="10" class="filter"/>
    <text x="393" y="97" class="filter-value ink">order-central</text>
    <text x="576" y="97" text-anchor="end" class="filter-value muted">⌄</text>

    <text x="610" y="55" class="filter-label muted">Domain</text>
    <rect x="610" y="68" width="180" height="46" rx="10" class="filter"/>
    <text x="628" y="97" class="filter-value ink">facilities</text>
    <text x="771" y="97" text-anchor="end" class="filter-value muted">⌄</text>

    <text x="805" y="55" class="filter-label muted">Shard region</text>
    <rect x="805" y="68" width="175" height="46" rx="10" class="filter"/>
    <text x="823" y="97" class="filter-value ink">All</text>
    <text x="961" y="97" text-anchor="end" class="filter-value muted">⌄</text>

    <text x="995" y="55" class="filter-label muted">Key</text>
    <rect x="995" y="68" width="180" height="46" rx="10" class="filter"/>
    <text x="1013" y="97" class="filter-value muted">Enter value</text>

    <text x="1190" y="55" class="filter-label muted">Time range</text>
    <rect x="1190" y="68" width="170" height="46" rx="10" fill="#eef4ff" stroke="#5794f2" stroke-width="2"/>
    <circle cx="1212" cy="91" r="8" fill="none" stroke="#5794f2" stroke-width="2"/>
    <path d="M1212 86 V91 L1216 94" fill="none" stroke="#5794f2" stroke-width="2" stroke-linecap="round"/>
    <text x="1230" y="97" class="filter-value ink">Last 1 hour</text>
    <text x="1341" y="97" text-anchor="end" class="filter-value muted">⌄</text>
  </g>

  <rect x="40" y="150" width="1320" height="626" rx="18" class="panel"/>

  <g transform="translate(0 -44)">
  <rect x="60" y="246" width="480" height="544" rx="12" class="metadata"/>
  <rect x="550" y="246" width="790" height="544" rx="12" class="plot"/>

  <text x="75" y="229" class="column muted">POD ID</text>
  <text x="250" y="229" class="column muted">REGION</text>
  <text x="360" y="229" class="column muted">SHARD RANGE</text>
  <text x="550" y="229" class="tick muted">10:00</text>
  <text x="748" y="229" text-anchor="middle" class="tick muted">10:15</text>
  <text x="945" y="229" text-anchor="middle" class="tick muted">10:30</text>
  <text x="1143" y="229" text-anchor="middle" class="tick muted">10:45</text>
  <text x="1340" y="229" text-anchor="end" class="tick muted">now</text>

  <g>
    <line x1="550" y1="246" x2="550" y2="790" class="grid"/>
    <line x1="748" y1="246" x2="748" y2="790" class="grid"/>
    <line x1="945" y1="246" x2="945" y2="790" class="grid"/>
    <line x1="1143" y1="246" x2="1143" y2="790" class="grid"/>
    <line x1="1340" y1="246" x2="1340" y2="790" class="grid"/>
  </g>

  <g class="meta ink">
    <text x="75" y="277">pod-a17c</text><text x="250" y="277">east-1</text><text x="360" y="277">0000–0800</text>
    <text x="75" y="311">pod-f29d</text><text x="250" y="311">east-1</text><text x="360" y="311">0000–0800</text>
    <text x="75" y="345">pod-b42f</text><text x="250" y="345">east-1</text><text x="360" y="345">0800–1600</text>
